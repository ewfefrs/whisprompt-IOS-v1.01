name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Whisprompt.xcodeproj \
            -scheme Whisprompt \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch on simulator and screenshot
        working-directory: ios
        run: |
          set -e
          APP=$(find build/Build/Products -name "Whisprompt.app" -type d | head -n1)
          echo "App path: $APP"
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Simulator UDID: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.whisprompt.app || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot ios-screenshot.png || xcrun simctl io booted screenshot ios-screenshot.png
          xcrun simctl shutdown "$DEVICE" || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: ios/ios-screenshot.png
          if-no-files-found: warn
